{% extends "base.html" %}{% block title %}{{ 'Nuevo chofer' if mode=='create' else 'Editar chofer' }}{% endblock %}{% block content %}{% include "transport/_styles.html" %}<div class="transport-shell"><div class="card card-pad"><div class="transport-head"><div><h2>{{ 'Nuevo chofer' if mode=='create' else 'Editar chofer' }}</h2></div><a class="btn" href="{{ url_for('transport.drivers_list') }}">Volver</a></div></div><form method="post" class="card card-pad"><div class="transport-grid three"><div class="transport-field"><label>Nombre</label><input name="name" value="{{ driver.name if driver else '' }}" required></div><div class="transport-field"><label>Cédula</label><input name="identification" value="{{ driver.identification if driver else '' }}" required></div><div class="transport-field"><label>Residencia</label><input name="residence" value="{{ driver.residence if driver else '' }}"></div><div class="transport-field"><label>Teléfono 1</label><input name="phone_1" value="{{ driver.phone_1 if driver else '' }}"></div><div class="transport-field"><label>Teléfono 2</label><input name="phone_2" value="{{ driver.phone_2 if driver else '' }}"></div><div class="transport-field"><label>Predio habitual</label><select name="habitual_site_id"><option value="">—</option>{% for s in sites %}<option value="{{ s.id }}" {% if driver and driver.habitual_site_id==s.id %}selected{% endif %}>{{ s.name or s.code }}</option>{% endfor %}</select></div><div class="transport-field"><label>Estado</label><select name="status">{% for v in driver_statuses|sort %}<option value="{{ v }}" {% if (driver and driver.status==v) or (not driver and v=='ACTIVE') %}selected{% endif %}>{{ v }}</option>{% endfor %}</select></div></div><div class="transport-field" style="margin-top:12px"><label>Notas</label><textarea name="notes">{{ driver.notes if driver else '' }}</textarea></div><div class="transport-actions" style="margin-top:14px"><button class="btn primary">{{ 'Crear chofer' if mode=='create' else 'Guardar cambios' }}</button><a class="btn" href="{{ url_for('transport.drivers_list') }}">Cancelar</a></div></form></div>{% endblock %}
