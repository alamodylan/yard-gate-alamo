{% extends "base.html" %}{% block title %}{{ 'Nuevo cabezal' if mode=='create' else 'Editar cabezal' }}{% endblock %}{% block content %}{% include "transport/_styles.html" %}<div class="transport-shell"><div class="card card-pad"><div class="transport-head"><div><h2>{{ 'Nuevo cabezal' if mode=='create' else 'Editar cabezal' }}</h2></div><a class="btn" href="{{ url_for('transport.trucks_list') }}">Volver</a></div></div><form method="post" class="card card-pad"><div class="transport-grid four"><div class="transport-field"><label>Fecha registro</label><input type="date" name="registration_date" value="{{ truck.registration_date.isoformat() if truck and truck.registration_date else '' }}" required></div><div class="transport-field"><label>Predio</label><select name="registered_site_id" required>{% for s in sites %}<option value="{{ s.id }}" {% if truck and truck.registered_site_id==s.id %}selected{% endif %}>{{ s.name or s.code }}</option>{% endfor %}</select></div><div class="transport-field"><label>Placa</label><input name="plate" value="{{ truck.plate if truck else '' }}" required></div><div class="transport-field"><label>Estado</label><select name="status">{% for v in truck_statuses|sort %}<option value="{{ v }}" {% if (truck and truck.status==v) or (not truck and v=='ACTIVE') %}selected{% endif %}>{{ v }}</option>{% endfor %}</select></div></div><div class="transport-section-title" style="margin-top:18px">Propietario</div><div class="transport-grid three"><div class="transport-field"><label>Nombre</label><input name="owner_name" value="{{ truck.owner.name if truck and truck.owner else '' }}"></div><div class="transport-field"><label>Teléfono</label><input name="owner_phone" value="{{ truck.owner.phone if truck and truck.owner else '' }}"></div><div class="transport-field"><label>Email</label><input name="owner_email" value="{{ truck.owner.email if truck and truck.owner else '' }}"></div></div><div class="transport-section-title" style="margin-top:18px">Documentación</div><div class="transport-grid four"><div class="transport-field"><label>Permiso muelle</label><input name="dock_permit_number" value="{{ truck.dock_permit_number if truck else '' }}"></div><div class="transport-field"><label>Vence permiso</label><input type="date" name="dock_permit_expiry_date" value="{{ truck.dock_permit_expiry_date.isoformat() if truck and truck.dock_permit_expiry_date else '' }}"></div><div class="transport-field"><label>Tarjeta circulación</label><input name="circulation_card" value="{{ truck.circulation_card if truck else '' }}"></div><div class="transport-field"><label>DEKRA mes</label><input type="number" min="1" max="12" name="dekra_month" value="{{ truck.dekra_month if truck and truck.dekra_month else '' }}"></div><div class="transport-field"><label>DEKRA año</label><input type="number" name="dekra_year" value="{{ truck.dekra_year if truck and truck.dekra_year else '' }}"></div><div class="transport-field"><label>Seguro</label><input name="insurance_name" value="{{ truck.insurance_name if truck else '' }}"></div><div class="transport-field"><label>Vence seguro</label><input type="date" name="insurance_expiry_date" value="{{ truck.insurance_expiry_date.isoformat() if truck and truck.insurance_expiry_date else '' }}"></div><div class="transport-field"><label>RT</label><input name="rt_name" value="{{ truck.rt_name if truck else '' }}"></div><div class="transport-field"><label>Vence RT</label><input type="date" name="rt_expiry_date" value="{{ truck.rt_expiry_date.isoformat() if truck and truck.rt_expiry_date else '' }}"></div><div class="transport-field"><label>Pesos/dimensiones</label><input type="number" step="0.01" name="weights_dimensions" value="{{ truck.weights_dimensions if truck and truck.weights_dimensions is not none else '' }}"></div><div class="transport-field"><label>Póliza</label><input name="policy_number" value="{{ truck.policy_number if truck else '' }}"></div><div class="transport-field"><label>Caución</label><select name="bonded_status">{% for v in bonded_statuses|sort %}<option value="{{ v }}" {% if (truck and truck.bonded_status==v) or (not truck and v=='PENDING') %}selected{% endif %}>{{ v }}</option>{% endfor %}</select></div></div><label style="display:flex;gap:8px;margin-top:12px"><input type="checkbox" name="is_payroll" value="1" {% if truck and truck.is_payroll %}checked{% endif %}> AUT / planilla</label><div class="transport-field" style="margin-top:12px"><label>Notas</label><textarea name="notes">{{ truck.notes if truck else '' }}</textarea></div><div class="transport-actions" style="margin-top:14px"><button class="btn primary">Guardar</button><a class="btn" href="{{ url_for('transport.trucks_list') }}">Cancelar</a></div></form></div>{% endblock %}
