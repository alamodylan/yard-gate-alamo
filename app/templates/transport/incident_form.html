{% extends "base.html" %}{% block title %}Nuevo incidente{% endblock %}{% block content %}{% include "transport/_styles.html" %}<div class="transport-shell"><div class="card card-pad"><div class="transport-head"><div><h2>Nuevo incidente</h2></div><a class="btn" href="{{ url_for('transport.incidents_list') }}">Volver</a></div></div><form method="post" class="card card-pad"><div class="transport-grid two"><div class="transport-field"><label>Cabezal</label><select name="truck_id" required><option value="">Seleccione</option>{% for t in trucks %}<option value="{{ t.id }}" {% if selected_truck_id==t.id %}selected{% endif %}>{{ t.plate }}</option>{% endfor %}</select></div><div class="transport-field"><label>Chofer</label><select name="driver_id"><option value="">Tomar asignación actual</option>{% for d in drivers %}<option value="{{ d.id }}" {% if selected_driver_id==d.id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></div><div class="transport-field"><label>Tipo</label><select name="incident_type" required>{% for t in incident_types|sort %}<option value="{{ t }}">{{ t }}</option>{% endfor %}</select></div><div class="transport-field"><label>Fecha/hora</label><input type="datetime-local" name="occurred_at"></div><div class="transport-field"><label>Ubicación</label><input name="location"></div><div class="transport-field"><label>Próximo seguimiento</label><input type="datetime-local" name="next_follow_up_at"></div></div><div class="transport-field" style="margin-top:12px"><label>Descripción</label><textarea name="description" required></textarea></div><button class="btn primary" style="margin-top:14px">Registrar incidente</button></form></div>{% endblock %}
