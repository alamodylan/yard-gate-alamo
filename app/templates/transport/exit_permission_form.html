{% extends "base.html" %}{% block title %}Nuevo permiso de salida{% endblock %}{% block content %}{% include "transport/_styles.html" %}<div class="transport-shell"><div class="card card-pad"><div class="transport-head"><div><h2>Nuevo permiso de salida</h2></div><a class="btn" href="{{ url_for('transport.exit_permissions_list') }}">Volver</a></div></div><form method="post" class="card card-pad"><div class="transport-grid two"><div class="transport-field"><label>Chofer</label><select name="driver_id" required><option value="">Seleccione</option>{% for d in drivers %}<option value="{{ d.id }}" {% if selected_driver_id==d.id %}selected{% endif %}>{{ d.name }} · {{ d.identification }}</option>{% endfor %}</select></div><div class="transport-field"><label>Cabezal</label><select name="truck_id"><option value="">Sin cabezal</option>{% for t in trucks %}<option value="{{ t.id }}" {% if selected_truck_id==t.id %}selected{% endif %}>{{ t.plate }}</option>{% endfor %}</select></div><div class="transport-field"><label>Salida</label><input type="datetime-local" name="departure_at"></div><div class="transport-field"><label>Regreso esperado</label><input type="datetime-local" name="expected_return_at"></div><div class="transport-field"><label>Motivo</label><input name="reason" required></div><div class="transport-field"><label>Destino</label><input name="destination"></div></div><div class="transport-field" style="margin-top:12px"><label>Notas</label><textarea name="notes"></textarea></div><button class="btn primary" style="margin-top:14px">Autorizar salida</button></form></div>{% endblock %}
